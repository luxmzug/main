name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:types
        env:
          ADMIN_EMAIL: ci@localhost.local
          ADMIN_PASSWORD: CiPlaceholder12
          SESSION_SECRET: ci-build-secret-must-be-at-least-32-chars
      - run: npm run build
        env:
          ADMIN_EMAIL: ci@localhost.local
          ADMIN_PASSWORD: CiPlaceholder12
          SESSION_SECRET: ci-build-secret-must-be-at-least-32-chars
