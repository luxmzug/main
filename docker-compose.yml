services:
  web:
    build: .
    container_name: luxusumzug-web
    restart: unless-stopped
    ports:
      - '2009:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: data/luxusumzug.db
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

  schedule-posts:
    build:
      context: .
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_PATH: data/luxusumzug.db
    volumes:
      - ./data:/app/data
    command: npx tsx --tsconfig tsconfig.json scripts/schedule-existing-posts.ts
    profiles:
      - tools
